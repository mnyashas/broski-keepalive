name: keep-alive

# Pings the Render free web service so it never spins down after 15 minutes idle.
# The target URL is stored as an Actions secret, so this public repo does not
# reveal it. Public repos get unlimited Actions minutes, which keeps this free.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 -m 90 "$TARGET_URL" || true)
          echo "HTTP $code"
          test "$code" = "200"
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}